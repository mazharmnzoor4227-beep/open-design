# Fork SWAP config — the fork takes the upstream slot: port 7456, the
# UPSTREAM data volume (same projects/settings/BYOK key), the UPSTREAM token
# (same login), the same tunnel URL. Bridge mode (auth enforced — see the
# alongside override's note on why host networking is forbidden here).
name: open-design-fork

services:
  open-design:
    container_name: open-design-fork
    image: ${OPEN_DESIGN_IMAGE:-open-design-fork-local}
    ports: !override
      - "127.0.0.1:7456:7456"
    environment:
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-}
      OD_API_TOKEN: ${OPEN_DESIGN_API_TOKEN}
      OD_ALLOWED_INTERNAL_HOSTS: host.docker.internal
      PATH: /mnt/host-local-bin:/usr/local/bin:/usr/bin:/bin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: !override
      - open-design_open_design_data:/app/.od
      - ${HOME}/.local/bin:/mnt/host-local-bin:ro
      - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    tmpfs:
      - /tmp
      - /home/open-design:uid=1001,gid=1001
    cpus: "1.5"
    # Fork: upstream defaults the container to 384m — an opencode run
    # (byok-opencode / Local) needs ~240MB+ at startup alone and the kernel
    # OOM-killed it (SIGKILL, run c5742360, 2026-11-20). Host has 12GB.
    mem_limit: "2g"

volumes:
  open-design_open_design_data:
    external: true
